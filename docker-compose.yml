services:
  backend:
    build:
      context: ./starter/backend
    container_name: movie-picture-backend
    ports:
      - "5000:5000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:5000/movies', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 20

  frontend:
    build:
      context: ./starter/frontend
      args:
        REACT_APP_MOVIE_API_URL: http://localhost:5000
    container_name: movie-picture-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
