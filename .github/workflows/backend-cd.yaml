name: Backend Continuous Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'starter/backend/**'
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: cluster
  ECR_REPOSITORY: backend
  PIPENV_NOSPIN: '1'

jobs:
  lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Pipenv
        run: python -m pip install --upgrade pip pipenv

      - name: Install dependencies
        working-directory: starter/backend
        run: pipenv install --dev --deploy

      - name: Run lint
        working-directory: starter/backend
        run: pipenv run lint

  test:
    name: Backend Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Pipenv
        run: python -m pip install --upgrade pip pipenv

      - name: Install dependencies
        working-directory: starter/backend
        run: pipenv install --dev --deploy

      - name: Run tests
        working-directory: starter/backend
        run: pipenv run test

  build:
    name: Build and Push Backend
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials from GitHub Secrets
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image name
        id: image
        run: echo "image=${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: docker build --tag "${{ steps.image.outputs.image }}" starter/backend

      - name: Push Docker image to ECR
        run: docker push "${{ steps.image.outputs.image }}"

  deploy:
    name: Deploy Backend to EKS
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials from GitHub Secrets
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.34.9'

      - name: Setup kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Configure access to EKS
        run: aws eks update-kubeconfig --name "${EKS_CLUSTER_NAME}" --region "${AWS_REGION}"

      - name: Deploy backend
        working-directory: starter/backend/k8s
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          kustomize edit set image backend="${IMAGE}"
          kustomize build | kubectl apply -f -
          kubectl rollout status deployment/backend --timeout=300s

      - name: Show backend service
        run: kubectl get service backend -o wide
